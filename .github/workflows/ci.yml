name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchid:
    name: Orchid lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Test
        run: bun run test

  app:
    name: App typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build (preview)
        run: bun run build

      # The bundle the App Studio runtime runs for a published app, built the way a publish builds it.
      - name: Build edge bundle (published app)
        run: bun run build:edge

  # Every template is a whole app like app/, built the same way.
  templates:
    name: Template ${{ matrix.template }} typecheck & build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [daily-checklist, shift-attendance]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run generate-routes && bun run typecheck

      - name: Build (preview)
        run: bun run build

      - name: Build edge bundle (published app)
        run: bun run build:edge
