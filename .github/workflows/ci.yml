name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Orchid tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test
